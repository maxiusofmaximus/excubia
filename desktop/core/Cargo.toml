[package]
name = "herdr-desktop-core"
version = "0.1.0"
edition = "2021"
description = "UI-free gateway client core for herdr notify desktop"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
hn-core-pin = { path = "../../core/crates/pin" }
p256 = { version = "0.14", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["windows-native"] }

[features]
default = []
os-keyring = ["dep:keyring"]

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
