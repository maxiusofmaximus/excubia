[package]
name = "herdr-notify-desktop"
version = "0.1.0"
edition = "2021"
description = "herdr notify para escritorio (Tauri 2)"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
async-trait = "0.1"
herdr-desktop-core = { path = "../core", features = ["os-keyring"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
