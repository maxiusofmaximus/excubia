<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Excubia — concepto D: el Excubitor grabado</title>
  <!-- Mismo yelmo que A, pero tratado como grabado a dos tintas: tramado de líneas
       para la sombra, rayos de almenara detrás y solo los ojos en luz. -->
  <defs>
    <clipPath id="marco"><rect width="512" height="512" rx="112"/></clipPath>
    <pattern id="trama" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#F3E3C0" stroke-width="2.4"/>
    </pattern>
    <pattern id="trama-fina" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#F3E3C0" stroke-width="1.2"/>
    </pattern>
    <clipPath id="sombra"><rect x="262" y="0" width="250" height="512"/></clipPath>
    <clipPath id="luz-izq"><rect x="0" y="0" width="250" height="512"/></clipPath>
    <path id="yelmo" d="M256 146 C 322 146 368 192 368 258 L 368 336 C 368 378 336 404 296 420 L 216 420 C 176 404 144 378 144 336 L 144 258 C 144 192 190 146 256 146 Z"/>
    <path id="rendija" d="M182 264 L 330 264 Q 342 264 338 276 L 334 290 Q 331 298 322 298 L 278 298 L 278 430 L 234 430 L 234 298 L 190 298 Q 181 298 178 290 L 174 276 Q 170 264 182 264 Z"/>
    <filter id="brillo" x="-80%" y="-300%" width="260%" height="700%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#14213D"/>
  <g clip-path="url(#marco)">
    <!-- Rayos de la almenara -->
    <g stroke="#F2A93B" stroke-linecap="round" opacity="0.55" id="rayos"></g>
    <g transform="translate(256 250)" stroke="#F2A93B" stroke-linecap="round">
      <g opacity="0.6" stroke-width="3">
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(0)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(15)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(30)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(45)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(60)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(75)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(90)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(105)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(120)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(135)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(150)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(165)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(180)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(195)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(210)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(225)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(240)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(255)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(270)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(285)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(300)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(315)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(330)"/>
        <line x1="0" y1="-160" x2="0" y2="-250" transform="rotate(345)"/>
      </g>
      <g opacity="0.35" stroke-width="1.6">
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(7.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(22.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(37.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(52.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(67.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(82.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(97.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(112.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(127.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(142.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(157.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(172.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(187.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(202.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(217.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(232.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(247.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(262.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(277.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(292.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(307.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(322.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(337.5)"/>
        <line x1="0" y1="-172" x2="0" y2="-222" transform="rotate(352.5)"/>
      </g>
    </g>
    <circle cx="256" cy="250" r="148" fill="none" stroke="#F2A93B" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Cimera de plumas, grabada -->
  <path d="M256 30 C 222 76 212 104 222 134 C 228 152 242 160 256 162 C 270 160 284 152 290 134 C 300 104 290 76 256 30 Z" fill="#14213D" stroke="#F3E3C0" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#F3E3C0" stroke-width="3" stroke-linecap="round">
    <path d="M256 58 L 256 156"/>
    <path d="M244 76 Q 234 110 240 150"/>
    <path d="M268 76 Q 278 110 272 150"/>
    <path d="M234 104 Q 228 126 232 146" opacity="0.7"/>
    <path d="M278 104 Q 284 126 280 146" opacity="0.7"/>
  </g>
  <!-- Yelmo: relleno noche, tramado de sombra a la derecha, filete claro -->
  <use href="#yelmo" fill="#14213D"/>
  <use href="#yelmo" fill="url(#trama)" clip-path="url(#sombra)"/>
  <use href="#yelmo" fill="url(#trama-fina)" clip-path="url(#luz-izq)" opacity="0.45"/>
  <use href="#yelmo" fill="none" stroke="#F3E3C0" stroke-width="7"/>
  <!-- Cresta central y banda de la frente -->
  <path d="M246 150 L 246 246 M266 150 L 266 246" stroke="#F3E3C0" stroke-width="4"/>
  <rect x="246" y="150" width="20" height="96" fill="#14213D" opacity="0.6"/>
  <path d="M146 250 Q 256 226 366 250" fill="none" stroke="#F3E3C0" stroke-width="6"/>
  <path d="M150 238 Q 256 214 362 238" fill="none" stroke="#F3E3C0" stroke-width="2.5" opacity="0.8"/>
  <!-- Brillo del metal (zona en blanco, sin trama) -->
  <path d="M176 206 Q 200 170 238 162" fill="none" stroke="#F3E3C0" stroke-width="12" stroke-linecap="round"/>
  <!-- Rendija y ojos -->
  <use href="#rendija" fill="#0B1426" stroke="#F3E3C0" stroke-width="5"/>
  <g fill="#F2A93B" filter="url(#brillo)">
    <ellipse cx="212" cy="281" rx="28" ry="10"/>
    <ellipse cx="300" cy="281" rx="28" ry="10"/>
  </g>
  <g fill="#FFF6E5">
    <ellipse cx="212" cy="281" rx="20" ry="5"/>
    <ellipse cx="300" cy="281" rx="20" ry="5"/>
  </g>
  <!-- Remaches -->
  <g fill="#14213D" stroke="#F3E3C0" stroke-width="3">
    <circle cx="176" cy="338" r="7"/>
    <circle cx="190" cy="378" r="7"/>
    <circle cx="336" cy="338" r="7"/>
    <circle cx="322" cy="378" r="7"/>
  </g>
</svg>
