[package]
name = "excubia-core-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Microsoft 365 mail drafts for Excubia core: device-code login, encrypted token store and a Graph client limited to drafts and small attachments (contract: mail.md)"

[dependencies]
aes-gcm = "0.10"
ammonia.workspace = true
async-trait = "0.1"
base64.workspace = true
excubia-core-persist = { path = "../persist" }
rusqlite.workspace = true
mrml = { version = "6.0", default-features = false, features = ["parse", "render"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
ulid.workspace = true
unicode-general-category = "1.1"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"

[dev-dependencies]
excubia-core-test-dir = { path = "../test-dir" }
tokio = { workspace = true, features = ["test-util"] }
