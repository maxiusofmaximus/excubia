[package]
name = "hn-core-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent host for herdr-notify core: supervises CLI agents in ptys and serves the local API"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
axum.workspace = true
hex.workspace = true
hn-core-api = { path = "../api" }
hn-core-auth = { path = "../auth" }
hn-core-chat = { path = "../chat" }
hn-core-detect = { path = "../detect" }
hn-core-persist = { path = "../persist" }
hn-core-pin = { path = "../pin" }
hn-core-pty = { path = "../pty" }
hn-core-seat = { path = "../seat" }
hn-core-state = { path = "../state" }
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
vt100.workspace = true

[dev-dependencies]
hn-core-test-dir = { path = "../test-dir" }
hn-core-test-support = { path = "../test-support" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }

[[bin]]
name = "host"
path = "src/bin/host.rs"

[[bin]]
name = "fake-agent"
path = "src/bin/fake-agent.rs"

[[bin]]
name = "hn-mcp"
path = "src/bin/hn-mcp.rs"

[[bin]]
name = "fake-cli"
path = "src/bin/fake-cli.rs"
