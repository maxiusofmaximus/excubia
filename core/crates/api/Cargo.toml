[package]
name = "excubia-core-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local HTTP + SSE API for Excubia core (contract: docs/contracts/api.md)"

[dependencies]
async-trait = "0.1"
axum.workspace = true
base64.workspace = true
futures-core.workspace = true
hex.workspace = true
excubia-core-asr = { path = "../asr" }
excubia-core-auth = { path = "../auth" }
excubia-core-chat = { path = "../chat" }
excubia-core-media = { path = "../media" }
excubia-core-pake = { path = "../pake" }
excubia-core-pin = { path = "../pin" }
excubia-core-seat = { path = "../seat" }
excubia-core-state = { path = "../state" }
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "ring"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
toml.workspace = true
toml_edit = "0.22"

[dev-dependencies]
excubia-core-test-dir = { path = "../test-dir" }
