org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# The machine also renders Blender and builds the desktop app in parallel; keep
# Gradle single-process and capped so it does not take the whole box.
org.gradle.daemon=false
org.gradle.workers.max=4
# The pub cache lives on C: while the project lives on D:, which breaks Kotlin's
# relocatable incremental caches for plugin sources (known cross-drive issue:
# "this and base files have different roots"). Plain, in-process compilation
# avoids both the caches and the daemon.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
